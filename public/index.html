<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="LBMate" />
<meta name="theme-color" content="#0a0a0c" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icons/icon-180.png" />
<link rel="stylesheet" href="/styles.css" />
<title>LBMate</title>
</head>
<body>
  <div class="status-spacer"></div>

  <header class="hero">
    <div class="hero-eyebrow">
      <span class="dot"></span>
      <span id="rt-status">Live data</span>
    </div>
    <h1 id="hero-title">To Manhattan</h1>
    <p id="hero-sub" class="hero-sub">Next bus at Stop H</p>
    <div class="hero-countdown" id="hero-countdown">—</div>
    <p id="hero-when" class="hero-when"></p>
  </header>

  <div class="segmented" role="tablist">
    <button class="seg seg-active" data-mode="work" role="tab" aria-selected="true">To Manhattan</button>
    <button class="seg" data-mode="home" role="tab" aria-selected="false">To Long Beach</button>
  </div>

  <main id="options" class="options">
    <div class="skeleton-card"></div>
    <div class="skeleton-card"></div>
    <div class="skeleton-card"></div>
  </main>

  <footer class="footer">
    <button id="refresh" class="refresh-btn" aria-label="Refresh">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3.36-7"/><path d="M21 3v6h-6"/></svg>
      <span id="refresh-label">Refresh</span>
    </button>
    <div class="footer-meta">
      <span id="last-updated">—</span>
    </div>
  </footer>

  <script src="/app.js" defer></script>
</body>
</html>
