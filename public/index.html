<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="LBMate" />
<meta name="theme-color" content="#0b2434" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icons/icon-180.png" />
<link rel="stylesheet" href="/styles.css" />
<title>LBMate</title>
</head>
<body>
  <div class="status-spacer"></div>

  <header class="hero">
    <div class="hero-eyebrow">
      <span class="dot"></span>
      <span id="rt-status">Live</span>
    </div>

    <div class="hero-mode">
      <span class="hero-pin"></span>
      <span id="hero-mode-label">To Manhattan</span>
    </div>

    <p id="hero-sub" class="hero-sub">Next bus at Grand &amp; W. Beech</p>

    <div class="hero-countdown" id="hero-countdown">—</div>
    <p id="hero-when" class="hero-when"></p>

    <svg class="hero-waves" viewBox="0 0 400 60" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0,40 C60,20 120,55 200,35 C280,15 340,50 400,30 L400,60 L0,60 Z" opacity="0.45"/>
      <path d="M0,48 C70,30 150,58 220,42 C300,26 350,52 400,40 L400,60 L0,60 Z" opacity="0.75"/>
    </svg>
  </header>

  <div class="segmented" role="tablist">
    <button class="seg seg-active" data-mode="manhattan" role="tab" aria-selected="true">
      <span class="seg-icon" aria-hidden="true">🚌</span>
      <span>To Manhattan</span>
    </button>
    <button class="seg" data-mode="longbeach" role="tab" aria-selected="false">
      <span class="seg-icon" aria-hidden="true">🌊</span>
      <span>To Long Beach</span>
    </button>
  </div>

  <main id="list" class="list">
    <div class="upcoming-label" id="upcoming-label">Upcoming</div>
    <div id="upcoming">
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
    </div>
  </main>

  <footer class="footer">
    <button id="refresh" class="refresh-btn" aria-label="Refresh">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3.36-7"/><path d="M21 3v6h-6"/></svg>
      <span>Refresh</span>
    </button>
    <div class="footer-meta">
      <span id="last-updated">—</span>
    </div>
  </footer>

  <script src="/app.js" defer></script>
</body>
</html>
